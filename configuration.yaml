# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  customize:
    climate.150633095227811_climate:
      target_temp_step: 1
    climate.150633095147232_climate:
      target_temp_step: 1
    climate.151732606772309_climate:
      target_temp_step: 1
    climate.151732606852802_climate:
      target_temp_step: 1
    climate.151732606852810_climate:
      target_temp_step: 1

sensor:
  - platform: integration
    source: sensor.bernier_matthew_carl_solar_power
    name: Solar Energy Today
    unique_id: solar_energy_today
    unit_prefix: k
    round: 2
    method: trapezoidal

utility_meter:
  solar_energy_daily:
    source: sensor.solar_energy_today
    cycle: daily

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml