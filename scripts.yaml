terrace_lights_script:
  sequence:
  - action: light.toggle
    metadata: {}
    target:
      entity_id:
      - light.terrace_lights_group
    data:
      brightness_pct: 50
  alias: Toggle Terrace Lights
  description: ''
terrace_lights_brightness_100:
  sequence:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
      - light.terrace_lights_group
    data:
      brightness_pct: 100
  alias: 'Terrace Lights brightness 100% '
  description: ''
terrace_lights_brightness_50:
  sequence:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
      - light.terrace_lights_group
    data:
      brightness_pct: 50
  alias: Terrace Lights brightness 50%
  description: ''
terrace_lights_brightness_25:
  sequence:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
      - light.terrace_lights_group
    data:
      brightness_pct: 25
  alias: Terrace Lights brightness 25%
  description: ''
increase_brightness_10:
  sequence:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
      - light.terrace_lights_group
